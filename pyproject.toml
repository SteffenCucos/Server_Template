[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-template"
version = "0.1.0"
description = "FastAPI server template with a CLI scaffolder."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pserialization",
    "argon2-cffi",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.13", "pymongo_inmemory"]
postgres = ["psycopg[binary]"]
sqlite = ["aiosqlite"]
db = ["pymongo>=4.13", "pymongo_inmemory", "psycopg[binary]", "aiosqlite"]
test = ["pytest", "httpx", "argon2-cffi", "pymongo>=4.13", "pymongo_inmemory", "aiosqlite"]
quality = ["mypy", "ruff"]

[project.scripts]
server-template = "server_template.cli:main"
server-scaffold = "server_template.cli:main"

[tool.setuptools.packages.find]
include = ["server_template*"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
norecursedirs = ["test-scafold", "test-scafold/app"]

[tool.mypy]
python_version = "3.10"
packages = [
    "api",
    "auth",
    "db",
    "models",
    "service",
    "users",
    "server_template",
]
mypy_path = "server"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["test-scafold"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
